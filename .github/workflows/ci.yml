name: CI
on: 
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 26.13.0
    - name: Install modules
      run: npm i
    - name: Build types for tsd
      run: npm run build
    - name: Run tests lint, tsd, jest
      run: npm run test